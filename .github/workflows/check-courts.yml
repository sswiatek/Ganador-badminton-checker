name: Sprawdzenie kortow Ganador

on:
  workflow_dispatch:

  schedule:
    - cron: "3-58/5 * * * *"

permissions:
  contents: write

concurrency:
  group: ganador-court-checker
  cancel-in-progress: false

jobs:
  check-courts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Konfiguracja Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalacja zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sprawdzenie kortow
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python check_courts.py

      - name: Zapisanie nowego statusu
        run: |
          if git diff --quiet state.json; then
            echo "Status nie ulegl zmianie."
            exit 0
          fi

          git config user.name "ganador-checker"
          git config user.email "ganador-checker@users.noreply.github.com"

          git add state.json
          git commit -m "Aktualizacja statusu kortow"

          git pull --rebase origin main
          git push origin main

      - name: Zachowanie diagnostyki
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ganador-diagnostics-${{ github.run_id }}
          path: |
            ganador-status.png
            ganador-page.html
          retention-days: 3
          if-no-files-found: ignore
